<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7cc4f5">
<title>Hi!Duck</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc4f5;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d1b19; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#7cc4f5, #d9f0ff); }
  /* telefonda tam ekran; bilgisayarda ortada telefon oranında */
  #unity-canvas { display: block; width: 100%; height: 100%; background: #dfeaf4; outline: none; }
  @media (min-aspect-ratio: 3/4) {
    #unity-canvas { height: 96%; width: auto; aspect-ratio: 9 / 19.5; border-radius: 22px;
      border: 4px solid #1d1b19; box-shadow: 8px 8px 0 #1d1b19; }
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#7cc4f5, #d9f0ff); z-index: 2; }
  #loading img { width: min(72vw, 320px); }
  #bar { width: min(62vw, 260px); height: 16px; margin-top: 22px; border: 3px solid #1d1b19; border-radius: 12px;
    background: #fffaf0; overflow: hidden; box-shadow: 3px 3px 0 #1d1b19; }
  #fill { height: 100%; width: 0; background: #1f9d5a; transition: width .2s; }
  #msg { margin-top: 14px; font-weight: 800; font-size: 15px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading">
  <img src="logo.png" alt="Hi!Duck">
  <div id="bar"><div id="fill"></div></div>
  <div id="msg">Yükleniyor…</div>
</div>
<script src="Build/Web.loader.js"></script>
<script>
  var canvas = document.getElementById("unity-canvas");
  var config = {
    dataUrl: "Build/Web.data.unityweb",
    frameworkUrl: "Build/Web.framework.js.unityweb",
    codeUrl: "Build/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "KacKat",
    productVersion: "1.0",
    // keskin görüntü ama telefonu yormasın
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  };
  createUnityInstance(canvas, config, function (progress) {
    document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
  }).then(function () {
    document.getElementById("loading").style.display = "none";
    canvas.focus();
  }).catch(function (message) {
    document.getElementById("msg").textContent = "Oyun açılamadı: " + message;
  });
</script>
</body>
</html>
